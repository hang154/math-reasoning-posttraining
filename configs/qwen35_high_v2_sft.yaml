model:
  name_or_path: ${LOCAL_ARTIFACT_PATH}
  quantization: none
  compute_dtype: bfloat16
  attn_implementation: sdpa
  trust_remote_code: false
data:
  sources:
  - kind: jsonl
    path: artifacts/grpo/controlled_34pt_experiment_v2/high_difficulty_four_point/sft_official_ocr.jsonl
  require_gold: true
  require_official_solution: true
  exclude_visual: true
  response_format: qwen_thinking
  reasoning_token_budget: 2400
  curriculum_context_path: configs/grpo/controlled_math_curriculum_context.v1.json
  max_prompt_tokens: 3072
  eval_fraction: 0.001
  seed: 20260808
  allowed_scores:
  - 4
lora:
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - in_proj_qkv
  - in_proj_z
  - in_proj_b
  - in_proj_a
  - out_proj
  - gate_proj
  - up_proj
  - down_proj
training:
  stage: sft
  output_dir: ${LOCAL_ARTIFACT_PATH}
  num_train_epochs: 1
  max_steps: 75
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-06
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  optim: adamw_torch_fused
  gradient_checkpointing: true
  max_grad_norm: 1.0
  max_length: 4096
  loss_type: nll
  logging_steps: 1
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  ddp_find_unused_parameters: false
  tf32: true
